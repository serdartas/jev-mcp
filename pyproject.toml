[project]
name = "jev-mcp"
version = "0.1.0"
description = "Shared Obasoft MCP server for TypeSafe Jev / System One."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "pydantic>=2.11,<3",
  "typesafe-sdk>=0.7,<1",
]

[project.scripts]
jev-mcp = "jev_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
